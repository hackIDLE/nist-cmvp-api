name: Update NIST CMVP Data

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering
    inputs:
      skip_algorithms:
        description: 'Skip algorithm extraction (faster run)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'validate_api.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Historical detail and PDF refreshes can still take a while on full rebuilds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          ALGORITHM_SOURCE: crawl4ai
          SKIP_ALGORITHMS: ${{ github.event.inputs.skip_algorithms == 'true' && '1' || '0' }}
        run: |
          python scraper.py

      - name: Validate generated API artifacts
        run: |
          python validate_api.py --require-current-schema --forbid-firecrawl-run-source

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code api/ openapi.json llms.txt llms-full.txt index.html || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/ openapi.json llms.txt llms-full.txt index.html
          git commit -m "Update NIST CMVP data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: |
          echo "No changes detected in the data"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-logs
          path: |
            api/
            *.log
          retention-days: 7
