name: Update NIST CMVP Data

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering
    inputs:
      skip_algorithms:
        description: 'Skip algorithm extraction (faster run)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'validate_api.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-nist-cmvp-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Historical detail and PDF refreshes can still take a while on full rebuilds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          ALGORITHM_SOURCE: crawl4ai
          PYTHONUNBUFFERED: '1'
          SKIP_ALGORITHMS: ${{ github.event.inputs.skip_algorithms == 'true' && '1' || '0' }}
        run: |
          python -u scraper.py

      - name: Validate generated API artifacts
        run: |
          python validate_api.py --require-current-schema --require-supported-algorithm-source --require-data-quality-pass

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code api/ openapi.json llms.txt llms-full.txt index.html || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/ openapi.json llms.txt llms-full.txt index.html
          git commit -m "Update NIST CMVP data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: |
          echo "No changes detected in the data"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-logs
          path: |
            api/
            *.log
          retention-days: 7

      - name: Alert on data refresh failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'data-refresh-failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: labelName,
              per_page: 100
            });
            const existingIssue = issues.data.find((issue) => !issue.pull_request);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingIssue.number,
                body: `Data refresh workflow failed again on ${now}.\n\nRun: ${runUrl}`
              });
            } else {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'd73a4a',
                  description: 'Automated alert for NIST CMVP data refresh failures'
                });
              } catch (error) {
                const alreadyExists = error.status === 422 &&
                  error.response &&
                  error.response.data &&
                  Array.isArray(error.response.data.errors) &&
                  error.response.data.errors.some((item) => item.code === 'already_exists');
                if (!alreadyExists) {
                  throw error;
                }
              }

              await github.rest.issues.create({
                owner,
                repo,
                title: 'Scheduled NIST CMVP data refresh is failing',
                labels: [labelName],
                body: `The scheduled NIST CMVP data refresh workflow failed on ${now}.\n\nRun: ${runUrl}\n\nThe published API may become stale until the workflow is fixed.`
              });
            }
