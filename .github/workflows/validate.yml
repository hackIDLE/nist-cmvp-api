name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m py_compile scraper.py test_scraper.py validate_api.py modal_scrape.py

      - name: Run ruff lint
        run: |
          python -m ruff check .

      - name: Run scraper tests
        run: |
          python -m pytest test_scraper.py -q

      - name: Validate checked-in API artifacts
        run: |
          python validate_api.py --require-current-schema --require-supported-algorithm-source --require-data-quality-pass

      - name: Check whitespace errors
        run: |
          git diff --check
